name: Build MX2040 Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 1. APT 系统包缓存
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential git python3-pip gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util libusb-1.0-0-dev ccache
          version: 1.0

      # 2. 缓存 vial-qmk
      - name: Cache vial-qmk source & submodules
        uses: actions/cache@v4
        id: cache_vialqmk
        with:
          path: vial-qmk
          key: ${{ runner.os }}-vialqmk-vial-v5-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-vialqmk-vial-v5-
            ${{ runner.os }}-vialqmk-vial-

      - name: Checkout vial-qmk
        if: steps.cache_vialqmk.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Update vial-qmk & submodules
        run: |
          cd vial-qmk
          git config --global --add safe.directory '*'
          git checkout vial
          git pull origin vial
          git submodule update --init --recursive

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/mx2040 vial-qmk/keyboards/

      # 3. ccache 编译缓存
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-qmk-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-qmk-ccache-

      - name: 配置 ccache 环境
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=200M" >> $GITHUB_ENV
          ccache --zero-stats || true

      - name: 安装 QMK CLI
        run: |
          python3 -m pip install --user qmk
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          qmk --version

      - name: 初始化 QMK 环境
        run: |
          cd vial-qmk
          qmk setup -y -H $(pwd)

      - name: 验证键盘配置
        run: |
          cd vial-qmk
          qmk info -kb mx2040

      # 编译固件
      - name: 编译固件
        run: |
          cd vial-qmk
          make mx2040:default CC="ccache arm-none-eabi-gcc" CXX="ccache arm-none-eabi-g++"

      - name: ccache 统计
        run: ccache --show-stats

      # =========================================================
      # 验证层 1：ELF 链接完整性
      # =========================================================
      - name: 验证 ELF 链接（未定义符号 / 入口点）
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf
          test -s "$ELF" || { echo "❌ ELF 文件不存在或为空"; exit 1; }

          echo "=== 1.1 未定义符号检查 ==="
          if arm-none-eabi-nm -u "$ELF" | grep -q .; then
            echo "❌ 存在未定义符号："
            arm-none-eabi-nm -u "$ELF"
            exit 1
          fi
          echo "✅ 无未定义符号"

          echo "=== 1.2 入口点检查 ==="
          ENTRY=$(arm-none-eabi-readelf -h "$ELF" | awk '/Entry point/{print $4}')
          echo "入口点: $ENTRY"
          python3 -c "
          entry = int('${ENTRY}', 16)
          assert 0x10000000 <= entry < 0x10200000, f'入口点 ${ENTRY} 不在 XIP flash 范围'
          print('✅ 入口点在 XIP flash 范围内')
          "

          echo "=== 1.3 ELF 头部完整性 ==="
          arm-none-eabi-readelf -h "$ELF" | grep -E "Type|Machine|Entry"
          arm-none-eabi-readelf -h "$ELF" | grep -q "ARM" || { echo "❌ 非 ARM 架构"; exit 1; }
          echo "✅ ELF 头部完整"

      # =========================================================
      # 验证层 2：段大小与 RP2040 容量
      # =========================================================
      - name: 验证段大小（Flash / RAM）
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf
          echo "=== 2.1 各段大小 ==="
          arm-none-eabi-size -A "$ELF"

          echo "=== 2.2 段容量校验 ==="
          python3 << 'PYEOF'
          import subprocess, sys
          out = subprocess.check_output(
              ["arm-none-eabi-size", "-A", ".build/mx2040_default.elf"], text=True)
          text = data = bss = 0
          for line in out.splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  if parts[0] == ".text": text = int(parts[1])
                  elif parts[0] == ".data": data = int(parts[1])
                  elif parts[0] == ".bss":  bss  = int(parts[1])
          FLASH_SIZE = 2 * 1024 * 1024
          RAM_SIZE   = 264 * 1024
          flash_used = text + data
          ram_used   = data + bss
          print(f"Flash 使用: {flash_used:,} / {FLASH_SIZE:,} 字节 ({flash_used*100//FLASH_SIZE}%)")
          print(f"RAM   使用: {ram_used:,} / {RAM_SIZE:,} 字节 ({ram_used*100//RAM_SIZE}%)")
          if flash_used > FLASH_SIZE:
              print(f"❌ Flash 溢出 {flash_used - FLASH_SIZE} 字节"); sys.exit(1)
          if ram_used > RAM_SIZE:
              print(f"❌ RAM 溢出 {ram_used - RAM_SIZE} 字节"); sys.exit(1)
          
