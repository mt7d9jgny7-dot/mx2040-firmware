name: Build MX2040 Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 1. APT 系统包缓存
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential git python3-pip gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util libusb-1.0-0-dev ccache
          version: 1.0

      # 2. 缓存 vial-qmk
      - name: Cache vial-qmk source & submodules
        uses: actions/cache@v4
        id: cache_vialqmk
        with:
          path: vial-qmk
          key: ${{ runner.os }}-vialqmk-vial-v7-${{ hashFiles('.github/workflows/build.yml', 'mx2040/rules.mk') }}
          restore-keys: |
            ${{ runner.os }}-vialqmk-vial-v7-
            ${{ runner.os }}-vialqmk-vial-

      - name: Checkout vial-qmk
        if: steps.cache_vialqmk.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Update vial-qmk & submodules
        run: |
          cd vial-qmk
          git config --global --add safe.directory '*'
          git checkout vial
          git pull origin vial
          git submodule update --init --recursive

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/mx2040 vial-qmk/keyboards/

      # 3. ccache 编译缓存
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-qmk-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-qmk-ccache-

      - name: 配置 ccache 环境
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=200M" >> $GITHUB_ENV
          ccache --zero-stats || true

      - name: 安装 QMK CLI
        run: |
          python3 -m pip install --user qmk
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          qmk --version

      - name: 初始化 QMK 环境
        run: |
          cd vial-qmk
          qmk setup -y -H $(pwd)

      - name: 验证键盘配置
        run: |
          cd vial-qmk
          qmk info -kb mx2040

      # 编译固件（规则来自 rules.mk：OPT=0 + LTO_ENABLE=no + -fno-inline + --no-gc-sections）
      - name: 编译固件
        run: |
          cd vial-qmk
          make mx2040:default CC="ccache arm-none-eabi-gcc" CXX="ccache arm-none-eabi-g++"

      - name: ccache 统计
        run: ccache --show-stats

      # =========================================================
      # 验证层 1：ELF 链接完整性
      # =========================================================
      - name: 验证 ELF 链接（未定义符号 / 入口点）
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf
          test -s "$ELF" || { echo "❌ ELF 文件不存在或为空"; exit 1; }

          echo "=== 1.1 未定义符号检查 ==="
          if arm-none-eabi-nm -u "$ELF" | grep -q .; then
            echo "❌ 存在未定义符号："
            arm-none-eabi-nm -u "$ELF"
            exit 1
          fi
          echo "✅ 无未定义符号"

          echo "=== 1.2 入口点检查 ==="
          ENTRY=$(arm-none-eabi-readelf -h "$ELF" | awk '/Entry point/{print $4}')
          echo "入口点: $ENTRY"
          python3 -c "
          entry = int('${ENTRY}', 16)
          assert 0x10000000 <= entry < 0x10200000, f'入口点 ${ENTRY} 不在 XIP flash 范围'
          print('✅ 入口点在 XIP flash 范围内')
          "

          echo "=== 1.3 ELF 头部完整性 ==="
          arm-none-eabi-readelf -h "$ELF" | grep -E "Type|Machine|Entry"
          arm-none-eabi-readelf -h "$ELF" | grep -q "ARM" || { echo "❌ 非 ARM 架构"; exit 1; }
          echo "✅ ELF 头部完整"

      # =========================================================
      # 验证层 2：段大小与 RP2040 容量（含 50% 体积警告）
      # =========================================================
      - name: 验证段大小（Flash / RAM）
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf
          echo "=== 2.1 各段大小 ==="
          arm-none-eabi-size -A "$ELF"

          echo "=== 2.2 段容量校验 ==="
          python3 << 'PYEOF'
          import subprocess, sys
          out = subprocess.check_output(
              ["arm-none-eabi-size", "-A", ".build/mx2040_default.elf"], text=True)
          text = data = bss = 0
          for line in out.splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  if parts[0] == ".text": text = int(parts[1])
                  elif parts[0] == ".data": data = int(parts[1])
                  elif parts[0] == ".bss":  bss  = int(parts[1])
          FLASH_SIZE = 2 * 1024 * 1024
          RAM_SIZE   = 264 * 1024
          flash_used = text + data
          ram_used   = data + bss
          flash_pct  = flash_used * 100 // FLASH_SIZE
          ram_pct    = ram_used * 100 // RAM_SIZE
          print(f"Flash 使用: {flash_used:,} / {FLASH_SIZE:,} 字节 ({flash_pct}%)")
          print(f"RAM   使用: {ram_used:,} / {RAM_SIZE:,} 字节 ({ram_pct}%)")
          if flash_used > FLASH_SIZE:
              print(f"❌ Flash 溢出 {flash_used - FLASH_SIZE} 字节"); sys.exit(1)
          if ram_used > RAM_SIZE:
              print(f"❌ RAM 溢出 {ram_used - RAM_SIZE} 字节"); sys.exit(1)
          if flash_pct >= 50:
              print(f"⚠️ Flash 已用 {flash_pct}% —— 由于禁用了优化（OPT=0），体积显著增大。")
              print("   发布固件前请注释 rules.mk 中的 OPT/LTO/CFLAGS/LDFLAGS 4 行后重新编译。")
          print("✅ Flash / RAM 容量均在 RP2040 规格内")
          PYEOF

      # =========================================================
      # 验证层 2.5：QMK + Vial 核心符号清单（完整 REQUIRED，去除优化后应全部存在）
      # =========================================================
      - name: 验证层 2.5 — QMK + Vial 核心符号清单
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf

          echo "=== 2.5.1 Vial 核心符号 ==="
          arm-none-eabi-nm -S -C --defined-only "$ELF" \
            | grep -iE "vial_(init|handle_cmd|keyboard_uid|unlock_combo|keyboard_definition)|keyboard_definition" \
            | sort -k4 || true

          echo ""
          echo "=== 2.5.2 QMK 动态键映射 / 主键位表符号 ==="
          arm-none-eabi-nm -S -C --defined-only "$ELF" \
            | grep -iE "\b(keymaps|layer_state|default_layer_state|dynamic_keymap_|raw_hid_|eeconfig_|keyboard_init|matrix_init|matrix_scan)\b" \
            | sort -k4 | head -n 60 || true

          echo ""
          echo "=== 2.5.3 RP2040 底层符号（wear_leveling / flash） ==="
          arm-none-eabi-nm -S -C --defined-only "$ELF" \
            | grep -iE "(wear_leveling_|flash_)" \
            | sort -k4 | head -n 40 || true

          echo ""
          echo "=== 2.5.4 关键符号存在性断言（完整 REQUIRED） ==="
          python3 << 'PYEOF'
          import subprocess, re, sys

          # ---- REQUIRED：去除优化后，以下符号必须全部存在 ----
          REQUIRED = [
              # Vial 核心
              (r"\bvial_init\b",                                     "Vial 初始化入口"),
              (r"\bvial_handle_cmd\b",                               "Vial 命令处理"),
              (r"\bvial_keyboard_uid\b",                             "Vial UID 数组"),
              (r"\bvial_unlock_combo_rows\b",                        "Vial 解锁行"),
              (r"\bvial_unlock_combo_cols\b",                        "Vial 解锁列"),
              (r"\b(vial_keyboard_definition|keyboard_definition)\b","内嵌 vial.json 定义"),
              # QMK 主键位表与初始化
              (r"\bkeymaps\b",                                       "键位矩阵"),
              (r"\bkeyboard_init\b",                                 "键盘初始化"),
              (r"\bmatrix_init\b",                                   "矩阵初始化"),
              (r"\bmatrix_scan\b",                                   "矩阵扫描"),
              (r"\beeconfig_init",                                   "EEPROM 初始化"),
              # 动态键映射
              (r"\bdynamic_keymap_reset\b",                          "动态键映射重置"),
              # Raw HID（Vial 通信基础）
              (r"\braw_hid_receive\b",                               "Raw HID 接收"),
              (r"\braw_hid_send\b",                                  "Raw HID 发送"),
              # RP2040 Flash 驱动
              (r"\bwear_leveling_init\b",                            "磨损均衡初始化"),
              (r"\bwear_leveling_read\b",                            "磨损均衡读"),
              (r"\bwear_leveling_write\b",                           "磨损均衡写"),
          ]

          # ---- OPTIONAL：static inline 或前缀随版本变化的符号 ----
          OPTIONAL = [
              (r"\bdynamic_keymap_(get|set)_keycode\b",              "动态键映射读写（static inline，无独立符号）"),
              (r"\b(rp2040_flash_|flash_)",                          "RP2040 Flash 驱动（前缀随版本变化）"),
          ]

          nm = subprocess.check_output(
              ["arm-none-eabi-nm", "-C", "--defined-only", ".build/mx2040_default.elf"],
              text=True
          )

          def check(items, label):
              missing = []
              print(f"--- {label} ---")
              for pat, desc in items:
                  ok = re.search(pat, nm) is not None
                  print(f"  {'✅' if ok else '❌'} {pat:55s} {desc}")
                  if not ok:
                      missing.append((pat, desc))
              return missing

          req_missing = check(REQUIRED, "REQUIRED（缺失即失败）")
          opt_missing = check(OPTIONAL, "OPTIONAL（缺失仅警告）")

          print("")
          if opt_missing:
              print(f"⚠️ {len(opt_missing)} 个 OPTIONAL 符号缺失（static inline 或前缀变化，属正常）：")
              for pat, desc in opt_missing:
                  print(f"   - {pat}  ({desc})")

          if req_missing:
              print(f"\n❌ {len(req_missing)} 个 REQUIRED 符号缺失：")
              for pat, desc in req_missing:
                  print(f"   - {pat}  ({desc})")
              print("\n如果此步骤失败，请检查：")
              print("  1) rules.mk 中 OPT=0、LTO_ENABLE=no、-fno-inline、--no-gc-sections 是否生效")
              print("  2) keyboard.json 的 features.vial 是否为 true")
              print("  3) 是否存在多个 rules.mk 被 QMK 覆盖的问题")
              sys.exit(1)

          print(f"\n✅ 所有 {len(REQUIRED)} 个 REQUIRED 符号存在；{len(OPTIONAL) - len(opt_missing)}/{len(OPTIONAL)} 个 OPTIONAL 符号存在")
          PYEOF

      # =========================================================
      # 验证层 2.6：从 ELF 导出内置 vial.json
      # =========================================================
      - name: 验证层 2.6 — 从 ELF 导出内置 vial.json
        run: |
          cd vial-qmk
          ELF=.build/mx2040_default.elf

          echo "=== 2.6.1 定位 keyboard_definition 符号 ==="
          SYM=$(arm-none-eabi-nm -S -C --defined-only "$ELF" \
                 | grep -iE "\b(vial_keyboard_definition|keyboard_definition)\b" | head -n 1)
          echo "$SYM"

          if [ -z "$SYM" ]; then
            echo "❌ 找不到 keyboard_definition 符号。"
            echo "--- 排查：列出所有含 definition 的符号 ---"
            arm-none-eabi-nm -C "$ELF" | grep -i "definition" || true
            exit 1
          fi

          echo ""
          echo "=== 2.6.2 解析并导出内置 JSON ==="
          python3 << 'PYEOF'
          import subprocess, re, sys, json

          ELF = ".build/mx2040_default.elf"

          # 1) 找到符号
          nm = subprocess.check_output(
              ["arm-none-eabi-nm", "-S", "--print-size", ELF], text=True
          )
          sym_pat = re.compile(
              r'^([0-9a-f]+)\s+([0-9a-f]+)\s+\w\s+(vial_keyboard_definition|keyboard_definition)$',
              re.M
          )
          m = sym_pat.search(nm)
          if not m:
              for line in nm.splitlines():
                  parts = line.split()
                  if len(parts) >= 4 and parts[3] in ("vial_keyboard_definition", "keyboard_definition"):
                      m = re.match(r'([0-9a-f]+)\s+([0-9a-f]+)', line)
                      break
          if not m:
              print("❌ 无法定位符号地址/大小"); sys.exit(1)

          sym_name = m.group(3) if m.lastindex and m.lastindex >= 3 else "(unknown)"
          sym_addr = int(m.group(1), 16)
          sym_size = int(m.group(2), 16)
          print(f"符号名    : {sym_name}")
          print(f"符号地址  : 0x{sym_addr:08X}")
          print(f"符号大小  : {sym_size} 字节")
          if sym_size == 0:
              print("❌ 符号大小为 0"); sys.exit(1)

          # 2) 找包含该符号的段
          sec_out = subprocess.check_output(
              ["arm-none-eabi-readelf", "-S", "-W", ELF], text=True
          )
          sections = []
          for line in sec_out.splitlines():
              mm = re.match(
                  r'\s*\[\s*\d+\]\s+(\S+)\s+(\S+)\s+([0-9a-f]+)\s+([0-9a-f]+)\s+([0-9a-f]+)',
                  line
              )
              if mm:
                  sections.append({
                      "name": mm.group(1),
                      "addr": int(mm.group(3), 16),
                      "off":  int(mm.group(4), 16),
                      "size": int(mm.group(5), 16),
                  })

          target = None
          for s in sections:
              if s["addr"] <= sym_addr < s["addr"] + s["size"] and s["name"] != ".bss":
                  target = s; break
          if not target:
              print("❌ 找不到包含符号的段"); sys.exit(1)

          print(f"所在段    : {target['name']}")
          print(f"段基址    : 0x{target['addr']:08X}")
          print(f"文件偏移  : 0x{target['off']:X}")

          # 3) 读取原始字节
          with open(ELF, "rb") as f:
              f.seek(target["off"] + (sym_addr - target["addr"]))
              raw = f.read(sym_size)
          print(f"读取字节  : {len(raw)} 字节")

          # 4) 解析 JSON（容忍末尾 null / padding）
          stripped = raw.rstrip(b"\x00\x20\x0a\x0d")
          for end in range(len(stripped), 0, -1):
              try:
                  obj = json.loads(stripped[:end])
                  print(f"✅ JSON 解析成功，实际长度 {end} 字节")
                  print("")
                  print("=== 内置 vial.json 内容 ===")
                  print(json.dumps(obj, indent=4, ensure_ascii=False))
                  with open("builtin_vial.json", "w", encoding="utf-8") as w:
                      json.dump(obj, w, indent=4, ensure_ascii=False)
                  print("")
                  print("📄 已落盘：vial-qmk/builtin_vial.json")
                  sys.exit(0)
              except json.JSONDecodeError:
                  continue

          print("❌ 无法解析为合法 JSON，原始内容前 300 字节：")
          print(stripped[:300])
          sys.exit(1)
          PYEOF

          echo ""
          echo "=== 2.6.3 内置 JSON 与源 vial.json 一致性校验 ==="
          python3 << 'PYEOF'
          import json, sys

          SRC = "keyboards/mx2040/vial.json"
          BLD = "builtin_vial.json"

          with open(SRC, encoding="utf-8") as f: src = json.load(f)
          with open(BLD, encoding="utf-8") as f: bld = json.load(f)

          KEY_FIELDS = ["name", "vendor_id", "product_id", "matrix", "vial"]
          mismatch = [k for k in KEY_FIELDS if src.get(k) != bld.get(k)]

          if mismatch:
              print(f"⚠️ 以下字段在源文件与内置 JSON 中不一致：{mismatch}")
          else:
              print("✅ 源 vial.json 与内置 JSON 的关键字段完全一致")

          src_km = src.get("layouts", {}).get("keymap", [])
          bld_km = bld.get("layouts", {}).get("keymap", [])
          print(f"源 KLE 行数       : {len(src_km)}")
          print(f"内置 KLE 行数     : {len(bld_km)}")
          if src_km == bld_km:
              print("✅ KLE 布局逐行一致")
          else:
              print("⚠️ KLE 布局存在差异（通常因 QMK 压缩时重排格式，属正常）")
          PYEOF

      # =========================================================
      # 验证层 3 + 4：UF2 块结构与布局
      # =========================================================
      - name: 验证 UF2 结构（块 / 地址 / familyID）
        run: |
          cd vial-qmk
          UF2=.build/mx2040_default.uf2
          test -s "$UF2" || { echo "❌ UF2 文件不存在或为空"; exit 1; }

          python3 << 'PYEOF'
          import struct, sys
          UF2_PATH = ".build/mx2040_default.uf2"
          MAGIC_START0 = 0x0A324655
          MAGIC_START1 = 0x9E5D5157
          MAGIC_END    = 0x0AB16F30
          RP2040_FAMILY = 0xE48BFF56
          FLASH_BASE = 0x10000000
          FLASH_SIZE = 0x200000
          errors = []
          with open(UF2_PATH, "rb") as f: data = f.read()
          size = len(data)
          print(f"UF2 文件大小: {size} 字节")
          if size == 0: print("❌ 文件为空"); sys.exit(1)
          if size % 512 != 0: print(f"❌ 大小 {size} 不是 512 的倍数"); sys.exit(1)
          total_blocks = size // 512
          expected_num_blocks = None
          addrs, psize = [], []
          for i in range(total_blocks):
              block = data[i*512:(i+1)*512]
              m0, m1, flags, addr, payload_size, block_no, num_blocks, fam = \
                  struct.unpack("<IIIIIIII", block[:32])
              end_magic = struct.unpack("<I", block[508:512])[0]
              if m0 != MAGIC_START0: errors.append(f"块 {i}: magicStart0=0x{m0:08X}")
              if m1 != MAGIC_START1: errors.append(f"块 {i}: magicStart1=0x{m1:08X}")
              if end_magic != MAGIC_END: errors.append(f"块 {i}: end magic=0x{end_magic:08X}")
              if expected_num_blocks is None: expected_num_blocks = num_blocks
              elif expected_num_blocks != num_blocks:
                  errors.append(f"块 {i}: numBlocks={num_blocks} 与期望 {expected_num_blocks} 不符")
              if block_no != i: errors.append(f"块 {i}: blockNo={block_no} 不连续")
              if addr < FLASH_BASE or addr + payload_size > FLASH_BASE + FLASH_SIZE:
                  errors.append(f"块 {i}: 地址 0x{addr:08X} 越界")
              if not (flags & 0x2000) and fam != RP2040_FAMILY:
                  errors.append(f"块 {i}: familyID=0x{fam:08X} 应为 0x{RP2040_FAMILY:08X}")
              addrs.append(addr); psize.append(payload_size)
          if expected_num_blocks != total_blocks:
              errors.append(f"numBlocks={expected_num_blocks} 与实际 {total_blocks} 不符")
          if addrs != sorted(addrs): errors.append("目标地址未按升序排列")
          for i in range(1, len(addrs)):
              if addrs[i] < addrs[i-1] + psize[i-1]:
                  errors.append(f"块 {i} 与块 {i-1} 地址重叠")
          print(f"总块数       : {total_blocks}")
          print(f"payload 大小 : {sorted(set(psize))}")
          print(f"地址范围     : 0x{min(addrs):08X} ~ 0x{max(addrs)+psize[addrs.index(max(addrs))]:08X}")
          print(f"固件数据总量 : {sum(psize):,} 字节")
          if errors:
              print("\n❌ UF2 验证失败:")
              for e in errors: print(f"  - {e}")
              sys.exit(1)
          print("\n✅ UF2 结构与布局验证通过")
          PYEOF

      # =========================================================
      # 验证层 5：产物完整性
      # =========================================================
      - name: 验证产物完整性（elf / uf2 / map）
        run: |
          cd vial-qmk
          echo "=== 5.1 产物清单 ==="
          ls -lh .build/mx2040_default.elf \
                 .build/mx2040_default.uf2 \
                 .build/mx2040_default.map 2>/dev/null || true
          echo "=== 5.2 强制存在性检查 ==="
          for f in .build/mx2040_default.elf .build/mx2040_default.uf2 .build/mx2040_default.map; do
            if [ ! -s "$f" ]; then
              echo "❌ 产物缺失或为空: $f"; exit 1
            fi
            echo "✅ $f 存在且非空"
          done
          echo "=== 5.3 UF2 大小合理性 ==="
          UF2_SIZE=$(stat -c%s .build/mx2040_default.uf2)
          python3 -c "
          s = ${UF2_SIZE}
          assert 1024 <= s <= 2*1024*1024, f'UF2 大小 {s} 异常'
          print(f'✅ UF2 大小 {s:,} 字节 在合理范围')
          "

      # =========================================================
      # 上传产物
      # =========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MX2040-Vial-Firmware
          path: |
            vial-qmk/.build/mx2040_default.uf2
            vial-qmk/.build/mx2040_default.elf
            vial-qmk/.build/mx2040_default.map
            vial-qmk/builtin_vial.json
          if-no-files-found: error
