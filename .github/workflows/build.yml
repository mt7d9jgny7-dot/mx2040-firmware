name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/MX2040 vial-qmk/keyboards/

      - name: 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            dfu-util libusb-1.0-0-dev

      - name: 安装 QMK CLI 并配置全局命令
        run: |
          # 安装完整 qmk 命令行工具，--user 适配 Ubuntu 24.04 系统 Python 规则
          python3 -m pip install --user qmk
          # 软链接到系统全局路径，Makefile 内部调用也能识别
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          # 验证命令可用性
          qmk --version

      - name: 初始化子模块与 QMK 环境
        run: |
          cd vial-qmk
          # 原生 git 命令初始化子模块，不依赖 qmk
          git submodule update --init --recursive
          # 完成环境校验，指定当前目录为 QMK 根目录，不拉取新仓库
          qmk setup -y -H $(pwd)

      - name: 编译固件
        run: |
          cd vial-qmk
          make MX2040:default

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: vial-qmk/.build/MX2040_default.uf2
