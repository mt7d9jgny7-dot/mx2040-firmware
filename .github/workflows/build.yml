name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          submodules: recursive

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/MX2040 vial-qmk/keyboards/

      - name: Setup QMK 环境
        run: |
          cd vial-qmk
          make git-submodule
          python3 -m pip install qmk

      - name: Compile firmware
        run: |
          cd vial-qmk
          qmk compile -kb MX2040 -km default

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: vial-qmk/.build/MX2040_default.uf2
