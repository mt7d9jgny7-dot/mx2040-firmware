name: Build MX2040 Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 1. 安装系统依赖（无缓存，每次全新安装）
      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util libusb-1.0-0-dev

      # 2. 克隆 vial-qmk（无缓存，每次全新克隆，确保代码最新）
      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Update vial-qmk & submodules
        run: |
          cd vial-qmk
          git config --global --add safe.directory '*'
          git checkout vial
          git pull origin vial
          git submodule update --init --recursive

      # 清理并复制键盘源码
      - name: Clean old keyboard dir
        run: rm -rf vial-qmk/keyboards/mx2040

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/mx2040 vial-qmk/keyboards/

      # 3. 安装 QMK CLI
      - name: 安装 QMK CLI
        run: |
          python3 -m pip install --user qmk
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          qmk --version

      - name: 初始化 QMK 环境
        run: |
          cd vial-qmk
          qmk setup -y -H $(pwd)

      - name: 验证键盘配置
        run: |
          cd vial-qmk
          qmk info -kb mx2040

      # 4. 编译固件（不使用 ccache，直接使用原生交叉编译器）
      - name: 编译固件
        run: |
          cd vial-qmk
          make mx2040:vial CC="arm-none-eabi-gcc" CXX="arm-none-eabi-g++"

      # =========================================================================
      # 🛡️ 深度校验固件文件（确保 Vial 相关功能已确实写入二进制）
      # =========================================================================
      - name: 深度校验固件文件
        run: |
          cd vial-qmk
          ELF=".build/mx2040_vial.elf"
          UF2=".build/mx2040_vial.uf2"

          echo "=========================================================="
          echo " 🛡️ 1. 固件段大小统计 (Section Sizes)"
          echo "=========================================================="
          arm-none-eabi-size -A $ELF | grep -E "\.text|\.data|\.bss|\.rodata" || true
          echo ""
          arm-none-eabi-size $ELF

          echo -e "\n=========================================================="
          echo " 🔍 2. 检查关键功能符号 (Symbol Check)"
          echo "=========================================================="
          echo "▶ 检查 Vial 核心通信协议..."
          arm-none-eabi-nm $ELF | grep -i "vial" | head -n 5 || echo "❌ 未找到 Vial 符号！"
          
          echo "▶ 检查 动态键映射 (Dynamic Keymap)..."
          arm-none-eabi-nm $ELF | grep -i "dynamic_keymap" | head -n 5 || echo "❌ 未找到 Dynamic Keymap！"
          
          echo "▶ 检查 EEPROM 磨损均衡 (Wear Leveling)..."
          arm-none-eabi-nm $ELF | grep -i "wear_leveling" | head -n 5 || echo "❌ 未找到 Wear Leveling！"

          echo -e "\n=========================================================="
          echo " 🗺️ 3. 检查内存地址映射 (Address Map)"
          echo "=========================================================="
          arm-none-eabi-objdump -h $ELF | grep -E "Idx|\.text|\.data|\.bss|\.vectors" || true

          echo -e "\n=========================================================="
          echo " 📜 4. 检查固件内部字符串 (Strings Check)"
          echo "=========================================================="
          echo "▶ 查找 Vial 特征字符串..."
          strings $ELF | grep -i "vial" | head -n 5 || echo "❌ 未找到 Vial 特征字符串"

          echo -e "\n=========================================================="
          echo " 📦 5. 验证 UF2 实体文件"
          echo "=========================================================="
          ls -lh $UF2
          test -s $UF2
          echo "✅ 固件深度校验完成，一切正常，已准备好烧录！"

      # 上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MX2040-Vial-Firmware
          path: vial-qmk/.build/mx2040_vial.uf2
