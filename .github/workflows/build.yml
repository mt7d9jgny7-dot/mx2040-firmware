name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/MX2040 vial-qmk/keyboards/

      - name: 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            dfu-util libusb-1.0-0-dev

      - name: 安装 QMK 依赖并配置全局命令
        run: |
          cd vial-qmk
          # --user 适配 Ubuntu 24.04 系统Python保护规则，安装与仓库匹配的依赖
          python3 -m pip install --user -r requirements.txt
          # 将 qmk 软链接到系统全局路径，Makefile 和命令行都能直接调用
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          # 验证命令可用性，提前发现问题
          qmk --version

      - name: 初始化 QMK 子模块
        run: |
          cd vial-qmk
          git submodule update --init --recursive

      - name: 编译固件
        run: |
          cd vial-qmk
          make MX2040:default

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: vial-qmk/.build/MX2040_default.uf2
