name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/MX2040 vial-qmk/keyboards/

      - name: 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            dfu-util libusb-1.0-0-dev

      - name: 配置 QMK 环境与命令
        run: |
          cd vial-qmk
          # 安装 Python 依赖库
          python3 -m pip install --user -r requirements.txt
          # 确保内置 qmk 脚本有执行权限
          chmod +x bin/qmk
          # 将仓库 bin 目录加入全局 PATH，后续所有步骤都能直接调用 qmk
          echo "$GITHUB_WORKSPACE/vial-qmk/bin" >> $GITHUB_PATH

      - name: 初始化 QMK 环境
        run: |
          cd vial-qmk
          # 验证命令可用性
          qmk --version
          # 初始化环境，指定当前目录为 QMK 根目录，不拉取新仓库
          qmk setup -y -H $(pwd)

      - name: 编译固件
        run: |
          cd vial-qmk
          make MX2040:default

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: vial-qmk/.build/MX2040_default.uf2
