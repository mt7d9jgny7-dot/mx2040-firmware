name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 排查仓库目录结构
        run: |
          echo "=== 仓库根目录文件列表 ==="
          ls -la $GITHUB_WORKSPACE
          echo "=== 三级目录内所有文件 ==="
          find $GITHUB_WORKSPACE -maxdepth 3 -type f | head -60

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          submodules: recursive
