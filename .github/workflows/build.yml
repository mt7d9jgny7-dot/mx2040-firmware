name: Build MX2040 Vial Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Checkout vial-qmk
        uses: actions/checkout@v5
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk

      - name: Copy keyboard source
        run: cp -r $GITHUB_WORKSPACE/mx2040 vial-qmk/keyboards/

      - name: 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            dfu-util libusb-1.0-0-dev

      - name: 安装 QMK CLI 并配置全局命令
        run: |
          python3 -m pip install --user qmk
          sudo ln -sf ~/.local/bin/qmk /usr/local/bin/qmk
          qmk --version

      - name: 初始化子模块与 QMK 环境
        run: |
          cd vial-qmk
          git submodule update --init --recursive
          qmk setup -y -H $(pwd)

      - name: 编译固件
        run: |
          cd vial-qmk
          make mx2040:default

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: vial-qmk/.build/mx2040_default.uf2
